name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/example/aimoverlay
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AimOverlay"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > app/build.gradle.kts <<'EOF_2'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.aimoverlay"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.aimoverlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_2
          cat > app/src/main/AndroidManifest.xml <<'EOF_3'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Aim Overlay"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AimService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF_3
          cat > app/src/main/java/com/example/aimoverlay/App.kt <<'EOF_4'
          package com.example.aimoverlay

          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sqrt

          class MainActivity : Activity() {
              private val reqCapture = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.gravity = Gravity.CENTER
                  box.setPadding(48, 48, 48, 48)

                  val title = TextView(this)
                  title.text = "Aim Overlay"
                  title.textSize = 26f
                  title.gravity = Gravity.CENTER

                  val help = TextView(this)
                  help.text = "১. শুরু চাপুন\n২. অনুমতি দিন (Entire screen বেছে নিন)\n৩. তারপর গেম খুলুন"
                  help.textSize = 18f
                  help.setPadding(0, 32, 0, 32)

                  val start = Button(this)
                  start.text = "শুরু"
                  val stop = Button(this)
                  stop.text = "বন্ধ"

                  box.addView(title)
                  box.addView(help)
                  box.addView(start)
                  box.addView(stop)
                  setContentView(box)

                  start.setOnClickListener { begin() }
                  stop.setOnClickListener { stopService(Intent(this, AimService::class.java)) }

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }
              }

              private fun begin() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                      return
                  }
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpm.createScreenCaptureIntent(), reqCapture)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqCapture && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, AimService::class.java)
                      i.putExtra("code", resultCode)
                      i.putExtra("data", data)
                      startForegroundService(i)
                      moveTaskToBack(true)
                  }
              }
          }

          class AimView(c: Context) : View(c) {
              @Volatile private var on = false
              @Volatile private var x1 = 0f
              @Volatile private var y1 = 0f
              @Volatile private var x2 = 0f
              @Volatile private var y2 = 0f

              // Cyan on purpose: the detector ignores cyan, so the line is not mistaken for a piece.
              private val line = Paint().apply {
                  color = Color.rgb(0, 255, 255)
                  strokeWidth = 6f
                  isAntiAlias = true
              }

              fun show(a: Float, b: Float, c: Float, d: Float) {
                  x1 = a; y1 = b; x2 = c; y2 = d
                  on = true
                  postInvalidate()
              }

              fun hide() {
                  on = false
                  postInvalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  if (!on) return
                  canvas.drawLine(x1, y1, x2, y2, line)
                  canvas.drawCircle(x2, y2, 8f, line)
              }
          }

          class AimService : Service() {
              private var projection: MediaProjection? = null
              private var vdisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var overlay: AimView? = null
              private var wm: WindowManager? = null
              private var thread: HandlerThread? = null
              private var last = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null || projection != null) return START_NOT_STICKY
                  startForegroundNow()

                  val code = intent.getIntExtra("code", 0)
                  val data = intent.getParcelableExtra<Intent>("data")
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val p = mpm.getMediaProjection(code, data)
                  projection = p
                  p.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopSelf()
                      }
                  }, Handler(Looper.getMainLooper()))

                  val windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  wm = windowManager
                  val dm = DisplayMetrics()
                  windowManager.defaultDisplay.getRealMetrics(dm)
                  val scale = 3
                  val w = dm.widthPixels / scale
                  val h = dm.heightPixels / scale

                  val v = AimView(this)
                  overlay = v
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  windowManager.addView(v, lp)

                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  reader = r
                  vdisplay = p.createVirtualDisplay(
                      "aim", w, h, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      r.surface, null, null
                  )

                  val t = HandlerThread("aim")
                  t.start()
                  thread = t
                  r.setOnImageAvailableListener({ rd ->
                      try {
                          val img = rd.acquireLatestImage()
                          if (img != null) {
                              try {
                                  val now = System.currentTimeMillis()
                                  if (now - last >= 100) {
                                      last = now
                                      process(img, w, h, scale.toFloat(), v)
                                  }
                              } finally {
                                  img.close()
                              }
                          }
                      } catch (e: Exception) {
                          // ignore frames that fail while shutting down
                      }
                  }, Handler(t.looper))

                  return START_NOT_STICKY
              }

              private fun startForegroundNow() {
                  val ch = "aim"
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel(ch, "Aim", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, ch)
                      .setContentTitle("Aim Overlay চলছে")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, n)
                  }
              }

              private class Circle(val x: Float, val y: Float, val r: Float)

              // Tunable numbers
              private val EDGE_MIN = 120          // lower = more edges (more sensitive)
              private val CIRCLE_FILL = 5.0f      // how complete a circle must be (lower = accepts weaker circles)

              private var bufN = 0
              private var cr = IntArray(0)
              private var cg = IntArray(0)
              private var cb = IntArray(0)
              private var acc = IntArray(0)
              private var exs = IntArray(0)
              private var eys = IntArray(0)
              private var egx = FloatArray(0)
              private var egy = FloatArray(0)

              private fun ensure(n: Int) {
                  if (bufN == n) return
                  bufN = n
                  cr = IntArray(n)
                  cg = IntArray(n)
                  cb = IntArray(n)
                  acc = IntArray(n)
                  val cap = n / 4
                  exs = IntArray(cap)
                  eys = IntArray(cap)
                  egx = FloatArray(cap)
                  egy = FloatArray(cap)
              }

              // Finds round shapes using edges only (no colour rules).
              private fun findCircles(img: Image, w: Int, h: Int): List<Circle> {
                  val n = w * h
                  ensure(n)
                  val plane = img.planes[0]
                  val buf = plane.buffer
                  val rs = plane.rowStride
                  val ps = plane.pixelStride
                  for (y in 0 until h) {
                      var o = y * rs
                      var i = y * w
                      for (x in 0 until w) {
                          cr[i] = buf.get(o).toInt() and 0xff
                          cg[i] = buf.get(o + 1).toInt() and 0xff
                          cb[i] = buf.get(o + 2).toInt() and 0xff
                          i++
                          o += ps
                      }
                  }

                  // 1) edges (strongest of R, G, B at every pixel)
                  val chans = arrayOf(cr, cg, cb)
                  val cap = exs.size
                  val minSq = EDGE_MIN * EDGE_MIN
                  var ne = 0
                  for (y in 1 until h - 1) {
                      for (x in 1 until w - 1) {
                          val i = y * w + x
                          var bestSq = 0
                          var bgx = 0
                          var bgy = 0
                          for (p in chans) {
                              val gx = (p[i - w + 1] + 2 * p[i + 1] + p[i + w + 1]) - (p[i - w - 1] + 2 * p[i - 1] + p[i + w - 1])
                              val gy = (p[i + w - 1] + 2 * p[i + w] + p[i + w + 1]) - (p[i - w - 1] + 2 * p[i - w] + p[i - w + 1])
                              val sq = gx * gx + gy * gy
                              if (sq > bestSq) {
                                  bestSq = sq
                                  bgx = gx
                                  bgy = gy
                              }
                          }
                          if (bestSq >= minSq && ne < cap) {
                              val m = sqrt(bestSq.toFloat())
                              exs[ne] = x
                              eys[ne] = y
                              egx[ne] = bgx / m
                              egy[ne] = bgy / m
                              ne++
                          }
                      }
                  }

                  // 2) every edge votes for possible circle centres along its gradient line
                  val rMin = max(4, (w * 0.012f).toInt())
                  val rMax = max(rMin + 2, (w * 0.06f).toInt())
                  java.util.Arrays.fill(acc, 0)
                  for (e in 0 until ne) {
                      val x = exs[e]
                      val y = eys[e]
                      val ux = egx[e]
                      val uy = egy[e]
                      var r = rMin
                      while (r <= rMax) {
                          val ax = Math.round(x + ux * r)
                          val ay = Math.round(y + uy * r)
                          if (ax >= 0 && ax < w && ay >= 0 && ay < h) acc[ay * w + ax]++
                          val bx = Math.round(x - ux * r)
                          val by = Math.round(y - uy * r)
                          if (bx >= 0 && bx < w && by >= 0 && by < h) acc[by * w + bx]++
                          r++
                      }
                  }

                  // 3) strongest local peaks are circle centre candidates
                  val voteMin = max(10, (3.1f * rMin).toInt())
                  val cand = ArrayList<Int>()
                  for (y in 1 until h - 1) {
                      for (x in 1 until w - 1) {
                          val i = y * w + x
                          val v = acc[i]
                          if (v < voteMin) continue
                          if (v < acc[i - 1] || v < acc[i + 1] || v < acc[i - w] || v < acc[i + w] ||
                              v < acc[i - w - 1] || v < acc[i - w + 1] || v < acc[i + w - 1] || v < acc[i + w + 1]) continue
                          cand.add(i)
                      }
                  }
                  cand.sortByDescending { acc[it] }

                  // 4) for each candidate find its radius from the edges around it
                  val out = ArrayList<Circle>()
                  val hist = IntArray(rMax + 3)
                  val lim = minOf(cand.size, 80)
                  for (ci in 0 until lim) {
                      val c = cand[ci]
                      val cx = c % w
                      val cy = c / w
                      java.util.Arrays.fill(hist, 0)
                      for (e in 0 until ne) {
                          val dx = exs[e] - cx
                          if (dx > rMax + 1 || dx < -(rMax + 1)) continue
                          val dy = eys[e] - cy
                          if (dy > rMax + 1 || dy < -(rMax + 1)) continue
                          val d = hypot(dx.toFloat(), dy.toFloat())
                          if (d < rMin - 1f || d > rMax + 1f || d < 0.5f) continue
                          val cs = (dx * egx[e] + dy * egy[e]) / d
                          if (abs(cs) < 0.85f) continue
                          hist[Math.round(d)]++
                      }
                      var bestScore = 0
                      var bestR = 0
                      for (r in rMin..rMax) {
                          val s = hist[r - 1] + hist[r] + hist[r + 1]
                          if (s > bestScore) {
                              bestScore = s
                              bestR = r
                          }
                      }
                      if (bestR == 0 || bestScore < CIRCLE_FILL * bestR) continue
                      var dup = false
                      for (a in out) {
                          if (hypot(a.x - cx, a.y - cy) < 0.8f * max(a.r, bestR.toFloat())) {
                              dup = true
                              break
                          }
                      }
                      if (!dup) out.add(Circle(cx.toFloat(), cy.toFloat(), bestR.toFloat()))
                      if (out.size >= 40) break
                  }
                  return out
              }

              // Fixed spots of the 8 printed orange circles, as fractions of the board (pocket to pocket).
              private val decor = floatArrayOf(
                  0.193f, 0.113f, 0.807f, 0.113f,
                  0.118f, 0.192f, 0.882f, 0.192f,
                  0.118f, 0.805f, 0.882f, 0.805f,
                  0.193f, 0.884f, 0.807f, 0.884f
              )

              private fun process(img: Image, w: Int, h: Int, k: Float, view: AimView) {
                  val all = findCircles(img, w, h)
                  val wf = w.toFloat()

                  // 1) find the board from its two bottom pockets (big round holes in the corners)
                  val pockets = all.filter { it.r >= 0.036f * wf && (it.x < 0.2f * wf || it.x > 0.8f * wf) }
                  var pl: Circle? = null
                  var pr: Circle? = null
                  var span = 0f
                  for (l in pockets) {
                      if (l.x > 0.2f * wf) continue
                      for (r in pockets) {
                          if (r.x < 0.8f * wf) continue
                          val sp = r.x - l.x
                          if (sp < 0.7f * wf || abs(l.y - r.y) > 0.03f * wf) continue
                          var hasTop = false
                          for (c in pockets) {
                              if (abs(c.y - (l.y - sp)) < 0.08f * sp && abs(c.x - l.x) < 0.05f * sp) hasTop = true
                          }
                          if (hasTop && (pl == null || l.y > pl.y)) {
                              pl = l
                              pr = r
                              span = sp
                          }
                      }
                  }
                  val bl = pl
                  val br = pr
                  if (bl == null || br == null) {
                      view.hide()
                      return
                  }
                  val yb = (bl.y + br.y) / 2f
                  val baseY = yb - 0.113f * span

                  // 2) round things inside the board: the one sitting on the bottom baseline is the striker
                  var st: Circle? = null
                  var sd = Float.MAX_VALUE
                  val coins = ArrayList<Circle>()
                  for (c in all) {
                      val fx = (c.x - bl.x) / span
                      val fy = (yb - c.y) / span
                      if (fx < 0.04f || fx > 0.96f || fy < 0.04f || fy > 0.96f) continue
                      if (c.r > 0.07f * wf) continue
                      var isDecor = false
                      var j = 0
                      while (j < decor.size) {
                          if (hypot(fx - decor[j], fy - decor[j + 1]) * span < 0.8f * max(c.r, 0.022f * wf)) isDecor = true
                          j += 2
                      }
                      if (isDecor) continue
                      val dy = abs(c.y - baseY)
                      if (dy <= 0.6f * c.r && fx > 0.2f && fx < 0.8f && dy < sd) {
                          st = c
                          sd = dy
                      }
                      coins.add(c)
                  }
                  val s = st
                  if (s == null) {
                      view.hide()
                      return
                  }

                  // 3) nearest piece in front of the striker
                  var target: Circle? = null
                  var best = Float.MAX_VALUE
                  for (c in coins) {
                      if (c === s) continue
                      if (c.y > s.y - s.r) continue
                      val d = hypot(c.x - s.x, c.y - s.y)
                      if (d < best) {
                          best = d
                          target = c
                      }
                  }
                  val tg = target
                  if (tg == null) {
                      view.hide()
                      return
                  }

                  val dx = tg.x - s.x
                  val dy2 = tg.y - s.y
                  val len = hypot(dx, dy2)
                  val ux = dx / len
                  val uy = dy2 / len
                  val rS = min(s.r, 0.03f * wf) * k
                  val rT = min(tg.r, 0.03f * wf) * k
                  val x1 = s.x * k + ux * (rS + 8f)
                  val y1 = s.y * k + uy * (rS + 8f)
                  val x2 = tg.x * k - ux * (rT + 8f)
                  val y2 = tg.y * k - uy * (rT + 8f)
                  if ((x2 - x1) * ux + (y2 - y1) * uy > 0f) {
                      view.show(x1, y1, x2, y2)
                  } else {
                      view.hide()
                  }
              }

              override fun onDestroy() {
                  try { overlay?.let { wm?.removeView(it) } } catch (e: Exception) { }
                  overlay = null
                  try { vdisplay?.release() } catch (e: Exception) { }
                  try { reader?.close() } catch (e: Exception) { }
                  try { projection?.stop() } catch (e: Exception) { }
                  projection = null
                  thread?.quitSafely()
                  super.onDestroy()
              }
          }
          EOF_4
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: aim-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Aim Overlay ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
